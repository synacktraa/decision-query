name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libicu-dev nlohmann-json3-dev libsqlite3-dev
      - run: make loadable static
      - run: make test-loadable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install wheel
      - run: make python
      - run: pip install --find-links dist/debug/wheels decision_query
      - run: make test-python
      - uses: actions/upload-artifact@v4
        with:
          name: decision-query-linux-x86_64
          path: |
            dist/debug/decision_query.so
            dist/debug/libdecision_query.a
            dist/debug/decision_query.h
            dist/debug/wheels/*.whl
  postgres-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libicu-dev nlohmann-json3-dev postgresql-16 postgresql-server-dev-16
      - run: make postgres
      - run: sudo make postgres-install
      - run: make test-postgres
      # pg_regress writes the diff to a file and prints only its path, so a
      # failure in CI is otherwise undiagnosable from the log alone.
      - name: Show the regression diff
        if: failure()
        run: cat build/postgres/regression.diffs || true
      - uses: actions/upload-artifact@v4
        with:
          name: pgdq-linux-x86_64
          path: |
            build/postgres/decision_query.so
            build/postgres/decision_query.control
            postgres/decision_query--*.sql
  clickhouse-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libicu-dev nlohmann-json3-dev libssl-dev
      # The oldest supported release, so the suite proves the minimum-version claim.
      - name: Install ClickHouse 25.3 LTS
        run: |
          curl -fsSL -o clickhouse.tgz https://github.com/ClickHouse/ClickHouse/releases/download/v25.3.14.14-lts/clickhouse-common-static-25.3.14.14-amd64.tgz
          tar -xzf clickhouse.tgz clickhouse-common-static-25.3.14.14/usr/bin/clickhouse
          sudo install -m 755 clickhouse-common-static-25.3.14.14/usr/bin/clickhouse /usr/local/bin/clickhouse
          clickhouse local --version
      - run: make clickhouse
      - run: make test-clickhouse
      - uses: actions/upload-artifact@v4
        with:
          name: decision-query-clickhouse-linux-x86_64
          path: |
            build/clickhouse/decision-query-udf
            build/clickhouse/decision_query_function.xml
            build/clickhouse/decision_query.sql
